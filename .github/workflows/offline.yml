name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/public_demo.py
      - run: uv run --locked research bench-run --presets baseline full --limit 3 --seed 42
